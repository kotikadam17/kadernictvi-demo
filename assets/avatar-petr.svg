<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="circle-petr">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <radialGradient id="bg-petr" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c8d8e8"/>
      <stop offset="100%" stop-color="#8aaccc"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="url(#bg-petr)"/>

  <!-- Body / shirt -->
  <ellipse cx="50" cy="108" rx="34" ry="22" fill="#2a4a7a"/>
  <ellipse cx="50" cy="100" rx="28" ry="18" fill="#3a5a8a"/>

  <!-- Neck -->
  <rect x="45" y="73" width="10" height="13" rx="4" fill="#d4a882"/>

  <!-- Shirt collar -->
  <path d="M42 86 L50 92 L58 86 L56 84 L50 89 L44 84 Z" fill="#fff"/>

  <!-- Head -->
  <ellipse cx="50" cy="60" rx="19" ry="21" fill="#d4a882"/>

  <!-- Hair - short dark -->
  <ellipse cx="50" cy="43" rx="20" ry="14" fill="#2a1a0e"/>
  <path d="M31 53 Q30 48 31 44 Q35 39 44 38 Q50 37 56 38 Q65 39 69 44 Q70 48 69 53" fill="#2a1a0e"/>

  <!-- Slight sideburns -->
  <rect x="30" y="54" width="4" height="10" rx="2" fill="#2a1a0e"/>
  <rect x="66" y="54" width="4" height="10" rx="2" fill="#2a1a0e"/>

  <!-- Eyes -->
  <ellipse cx="43" cy="61" rx="3.5" ry="2.8" fill="#fff"/>
  <ellipse cx="57" cy="61" rx="3.5" ry="2.8" fill="#fff"/>
  <circle cx="43.5" cy="61.2" r="2.2" fill="#3a2810"/>
  <circle cx="57.5" cy="61.2" r="2.2" fill="#3a2810"/>
  <circle cx="44.2" cy="60.3" r="0.7" fill="#fff"/>
  <circle cx="58.2" cy="60.3" r="0.7" fill="#fff"/>

  <!-- Eyebrows - masculine, thicker -->
  <path d="M39 56.5 Q43 54.5 47 56" stroke="#2a1a0e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M53 56 Q57 54.5 61 56.5" stroke="#2a1a0e" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Nose - wider -->
  <path d="M48.5 64 Q47.5 68 46 70 Q49.5 71.5 54 70 Q52.5 68 51.5 64" fill="#c4987a" stroke="none"/>
  <!-- Nostril hints -->
  <ellipse cx="47" cy="70" rx="1.8" ry="1.2" fill="#b88060" opacity="0.6"/>
  <ellipse cx="53" cy="70" rx="1.8" ry="1.2" fill="#b88060" opacity="0.6"/>

  <!-- Mouth -->
  <path d="M44 74 Q50 77.5 56 74" stroke="#a86848" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M45 74.5 Q50 77 55 74.5" fill="#c07858" opacity="0.7"/>

  <!-- Light stubble / jaw shadow -->
  <ellipse cx="50" cy="75" rx="14" ry="7" fill="#b88060" opacity="0.2"/>
  <ellipse cx="38" cy="68" rx="5" ry="8" fill="#b88060" opacity="0.15"/>
  <ellipse cx="62" cy="68" rx="5" ry="8" fill="#b88060" opacity="0.15"/>

  <!-- Ear left -->
  <ellipse cx="31" cy="61" rx="3" ry="4.5" fill="#d4a882"/>
  <!-- Ear right -->
  <ellipse cx="69" cy="61" rx="3" ry="4.5" fill="#d4a882"/>
</svg>
