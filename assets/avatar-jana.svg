<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="circle-jana">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <radialGradient id="bg-jana" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8d5d5"/>
      <stop offset="100%" stop-color="#c9a8b0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="url(#bg-jana)"/>

  <!-- Body / shoulders -->
  <ellipse cx="50" cy="105" rx="32" ry="22" fill="#d4687a"/>
  <ellipse cx="50" cy="98" rx="26" ry="16" fill="#e07a8a"/>

  <!-- Neck -->
  <rect x="44" y="72" width="12" height="14" rx="5" fill="#f2c9bb"/>

  <!-- Head -->
  <ellipse cx="50" cy="60" rx="20" ry="22" fill="#f2c9bb"/>

  <!-- Hair - long brown wavy -->
  <ellipse cx="50" cy="46" rx="22" ry="17" fill="#6b3a2a"/>
  <!-- Side hair left -->
  <path d="M28 60 Q24 72 26 85 Q30 80 32 72 Q31 65 30 60 Z" fill="#6b3a2a"/>
  <!-- Side hair right -->
  <path d="M72 60 Q76 72 74 85 Q70 80 68 72 Q69 65 70 60 Z" fill="#6b3a2a"/>
  <!-- Hair flowing down left -->
  <path d="M30 62 Q26 78 28 92 Q32 86 34 78 Q34 68 32 62 Z" fill="#5c3020"/>
  <!-- Hair flowing down right -->
  <path d="M70 62 Q74 78 72 92 Q68 86 66 78 Q66 68 68 62 Z" fill="#5c3020"/>

  <!-- Eyes -->
  <ellipse cx="43" cy="60" rx="3.5" ry="2.8" fill="#fff"/>
  <ellipse cx="57" cy="60" rx="3.5" ry="2.8" fill="#fff"/>
  <circle cx="43.5" cy="60.2" r="2.2" fill="#4a2c1a"/>
  <circle cx="57.5" cy="60.2" r="2.2" fill="#4a2c1a"/>
  <circle cx="44.2" cy="59.3" r="0.7" fill="#fff"/>
  <circle cx="58.2" cy="59.3" r="0.7" fill="#fff"/>

  <!-- Eyebrows -->
  <path d="M39.5 55.5 Q43 53.5 46.5 55" stroke="#5c3020" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M53.5 55 Q57 53.5 60.5 55.5" stroke="#5c3020" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M49 63 Q48 67 47 68.5 Q49.5 70 52 68.5 Q51 67 50 63" fill="#e0b0a0" stroke="none"/>

  <!-- Mouth / smile -->
  <path d="M44.5 73 Q50 77 55.5 73" stroke="#c0607a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M45 73.5 Q50 76.5 55 73.5" fill="#e8808a"/>

  <!-- Eyelashes top -->
  <path d="M40 57.8 Q43 56.5 46.5 57.5" stroke="#3a2010" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M53.5 57.5 Q57 56.5 60 57.8" stroke="#3a2010" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Cheek blush -->
  <ellipse cx="38" cy="66" rx="5" ry="3" fill="#f0a0a8" opacity="0.4"/>
  <ellipse cx="62" cy="66" rx="5" ry="3" fill="#f0a0a8" opacity="0.4"/>
</svg>
